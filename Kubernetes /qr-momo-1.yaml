apiVersion: apps/v1
kind: Deployment
metadata:
  name: qr-momo
spec:
  replicas: 7
  selector:
    matchLabels:
      app: qr-momo
  template:
    metadata:
      labels:
        app: qr-momo
    spec:
      containers:
      - name: qr-momo
        image: jaymath237/qr-momo:latest
        resources:
          limits:
            memory: "128Mi"
            cpu: "500m"
        ports:
        - containerPort: 80

