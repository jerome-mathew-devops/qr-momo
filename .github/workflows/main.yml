name: Build Docker Image and Push To DockerHub  //Descriptive for our workflow
  on:
    push:  //github event trigger
      branches: [develop]

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      -uses: actions/checkout@v4  
      
      -name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      -name: Build and Push Docker image
        uses: docker/build-push-action@v6  //Build image
        with:
          context: .
          push: true //Push image when build is successful
          tags: ${{ secrets.DOCKER_USERNAME }}/qr-momo:latest tags the docker repo
          
